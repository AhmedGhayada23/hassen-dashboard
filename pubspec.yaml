name: hassen_dashboard
description: "HASEEN Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Restored from pubspec.lock (direct dependencies, locked versions).
dependencies:
  flutter:
    sdk: flutter
  animate_do: ^5.1.0
  bloc: ^9.2.1
  cached_network_image: ^3.4.1
  cloud_firestore: ^7.1.0
  connectivity_plus: ^7.3.2
  cupertino_icons: ^1.0.9
  dartz: ^0.10.1
  dio: ^5.11.1
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.2
  get_it: ^9.3.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  internet_connection_checker: ^1.0.0+1
  intl: ^0.20.2
  lottie: ^3.7.0
  path_provider: ^2.1.6
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.6
  shimmer: ^3.0.0
  url_launcher: ^6.3.3
  toastification: ^3.2.2
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_test:
